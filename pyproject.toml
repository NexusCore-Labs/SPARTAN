[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spartan"
version = "0.1.0"
description = "Satellite Pixel-Augmented Resolution & Terrain Analysis Network"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aryan Bhatkar" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]